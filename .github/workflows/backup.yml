name: Weekly Backup

# 毎週、本番の DB の写しを Cloudflare R2 のバケット(sotaapp2-backup)に保存する。
# - 保存先: weekly/sotaapp2_YYYYMMDD_HHMMSS.db.gz。バケットのライフサイクルで、90 日後に自動で消える(約 3 か月分)
# - デプロイ(deploy.yml)のバックアップは、デプロイ前の保険。これは定期の保存
# - 復元の手順は docs/backup.md
#
# 必要な Secrets: FLY_API_TOKEN(deploy.yml と同じ)、R2_ENDPOINT_URL、R2_ACCESS_KEY_ID、R2_SECRET_ACCESS_KEY

on:
  schedule:
    # 日曜 18:00 UTC = 月曜 03:00 JST(アクセスの少ない時間)
    - cron: '0 18 * * 0'
  workflow_dispatch:

permissions:
  contents: read

# 重ならないようにする(手動実行と定期実行など)。デプロイ(deploy.yml)とは、写しのファイル名を分けてあるので取り合わない
concurrency:
  group: fly-db-snapshot
  cancel-in-progress: false

env:
  R2_BUCKET: sotaapp2-backup

jobs:
  backup:
    name: Backup database to R2
    runs-on: ubuntu-latest
    # 取得が止まっても、待ち続けない
    timeout-minutes: 20

    steps:
      - name: Setup Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Snapshot and download
        id: dump
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          TIMESTAMP=$(date -u +%Y%m%d_%H%M%S)
          NAME="sotaapp2_${TIMESTAMP}.db"
          # デプロイ(backup_*.db)と取り合わないよう、別の名前にする
          SNAPSHOT="/data/weekly_${TIMESTAMP}.db"

          # 前の回が残していた写しがあれば消す(1 つ 155MB 程度。残るとボリュームを埋める)
          timeout -k 10 60 flyctl ssh console -C "sh -c 'rm -f /data/weekly_*.db'" || echo "::warning::Could not remove old snapshots"

          # 動いている DB の写しを、マシンの中で作る。VACUUM INTO は、WAL の分も含めた一貫した 1 つのファイルになる
          if timeout -k 10 60 flyctl ssh console -C "sh -c 'command -v sqlite3 >/dev/null && echo HAS_SQLITE3 || echo NO_SQLITE3'" 2>&1 | grep -q HAS_SQLITE3; then
            timeout -k 10 300 flyctl ssh console -C "sqlite3 /data/sotaapp2.db \"VACUUM INTO '${SNAPSHOT}'\""
            SOURCE="${SNAPSHOT}"
          else
            echo "::warning::sqlite3 is not in the running image. Downloading the database file only (changes still in the WAL are not included)"
            SOURCE=/data/sotaapp2.db
          fi

          # sftp get は止まることがある(deploy.yml と同じ事情)。ssh の標準出力で、gzip したものを受け取る
          timeout -k 10 300 flyctl ssh console -C "gzip -c ${SOURCE}" > "./${NAME}.gz"

          # 途中で切れていないか、SQLite として壊れていないかを確かめる
          gunzip -c "./${NAME}.gz" > "./${NAME}"
          python3 -c 'import sqlite3, sys; r = sqlite3.connect(sys.argv[1]).execute("PRAGMA integrity_check").fetchone()[0]; sys.exit(r != "ok")' "./${NAME}"
          rm -f "./${NAME}"

          SIZE=$(stat -c %s "./${NAME}.gz")
          echo "Downloaded and verified: ${NAME}.gz (${SIZE} bytes)"
          echo "file=${NAME}.gz" >> "$GITHUB_OUTPUT"
          echo "size=${SIZE}" >> "$GITHUB_OUTPUT"

      - name: Remove snapshot on the machine
        if: always()
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          timeout -k 10 60 flyctl ssh console -C "sh -c 'rm -f /data/weekly_*.db'" || echo "::warning::Could not remove snapshots"

      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # R2 は、新しい AWS CLI が付けるチェックサムの追加ヘッダーを受け付けないことがある
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          ENDPOINT: ${{ secrets.R2_ENDPOINT_URL }}
          FILE: ${{ steps.dump.outputs.file }}
          SIZE: ${{ steps.dump.outputs.size }}
        run: |
          set -euo pipefail
          KEY="weekly/${FILE}"
          aws s3 cp "./${FILE}" "s3://${R2_BUCKET}/${KEY}" --endpoint-url "${ENDPOINT}"
          # 置けたこと(サイズが同じこと)を確かめる
          REMOTE=$(aws s3api head-object --bucket "${R2_BUCKET}" --key "${KEY}" --endpoint-url "${ENDPOINT}" --query ContentLength --output text)
          if [ "${REMOTE}" != "${SIZE}" ]; then
            echo "::error::Size mismatch: local ${SIZE}, remote ${REMOTE}"
            exit 1
          fi
          echo "Uploaded: ${KEY} (${REMOTE} bytes)"
