name: Weekly Backup

# 毎週、本番の DB の写しを Cloudflare R2 のバケット(sotaapp2-backup)に保存する。
# - 保存先: weekly/sotaapp2_YYYYMMDD_HHMMSS.db.gz。バケットのライフサイクルで、90 日後に自動で消える(約 3 か月分)
# - デプロイ前の写しは、deploy.yml が pre-deploy/ に同じ方法で保存する(7 日)
# - 処理は .github/actions/db-backup。復元の手順は docs/backup.md
#
# 必要な Secrets: FLY_API_TOKEN、R2_ENDPOINT_URL、R2_ACCESS_KEY_ID、R2_SECRET_ACCESS_KEY

on:
  schedule:
    # 日曜 18:00 UTC = 月曜 03:00 JST(アクセスの少ない時間)
    - cron: '0 18 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    name: Backup database to R2
    runs-on: ubuntu-latest
    # 取得が止まっても、待ち続けない
    timeout-minutes: 20
    # 重ならないようにする(手動実行・デプロイ前のバックアップと)
    concurrency:
      group: fly-db-snapshot
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/db-backup
        with:
          prefix: weekly
          fly-api-token: ${{ secrets.FLY_API_TOKEN }}
          r2-endpoint: ${{ secrets.R2_ENDPOINT_URL }}
          r2-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
