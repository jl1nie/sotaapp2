name: CI

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: true
  REGISTRY: docker.io
  IMAGE_NAME: jl1nie/sotaapp2

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Run tests
        run: cargo nextest run --workspace --test-threads=1

  # イメージは 1 回だけビルドする。
  # PR: ビルドして E2E を流し、通ったら PR の先頭の SHA を tag にして push する(同じ repo の PR だけ)。
  # main への push: マージコミットの中身(tree)が PR の先頭と同じなら、PR のイメージに main の SHA と latest の
  # tag を足すだけにする。違うとき(PR が main に追いついていない、直接 push した)は、ここでビルドする。
  # Deploy は main の SHA の tag を探すので、どちらでも同じように動く。
  docker-build:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [lint, test]
    outputs:
      image_pushed: ${{ steps.push-check.outputs.should_push }}
      deploy_image: ${{ steps.vars.outputs.deploy_image }}
      sha_tag: ${{ steps.vars.outputs.sha_tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          # main への push で、マージコミットの 2 つ目の親(PR の先頭)を見るため
          fetch-depth: 2

      - name: Check if should push
        id: push-check
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "should_push=true" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "pull_request" && "${{ github.event.pull_request.head.repo.full_name }}" == "${{ github.repository }}" ]]; then
            echo "should_push=true" >> $GITHUB_OUTPUT
          else
            echo "should_push=false" >> $GITHUB_OUTPUT
          fi

      - name: Set variables
        id: vars
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            SHA="${{ github.event.pull_request.head.sha }}"
          else
            SHA="${{ github.sha }}"
          fi
          SHA_SHORT=$(echo "$SHA" | cut -c1-7)
          echo "sha_tag=${SHA_SHORT}" >> $GITHUB_OUTPUT
          echo "deploy_image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${SHA_SHORT}" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        if: steps.push-check.outputs.should_push == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Reuse the image built for the PR
        id: reuse
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          if ! git rev-parse -q --verify HEAD^2 >/dev/null; then
            echo "Not a merge commit. Building."
            echo "reused=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          PR_HEAD=$(git rev-parse --short=7 HEAD^2)
          if [[ "$(git rev-parse 'HEAD^{tree}')" != "$(git rev-parse 'HEAD^2^{tree}')" ]]; then
            echo "The merge result differs from the PR head ${PR_HEAD} (the PR was behind main). Building."
            echo "reused=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          if ! docker buildx imagetools inspect "${IMAGE}:${PR_HEAD}" >/dev/null 2>&1; then
            echo "No image for the PR head ${PR_HEAD}. Building."
            echo "reused=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          docker buildx imagetools create \
            -t "${IMAGE}:${{ steps.vars.outputs.sha_tag }}" -t "${IMAGE}:latest" \
            "${IMAGE}:${PR_HEAD}"
          echo "Tagged ${IMAGE}:${PR_HEAD} as ${{ steps.vars.outputs.sha_tag }} and latest (tested in the PR)."
          echo "reused=true" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        if: steps.reuse.outputs.reused != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build image
        if: steps.reuse.outputs.reused != 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: sotaapp2:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run E2E tests
        if: steps.reuse.outputs.reused != 'true'
        run: ./scripts/docker-e2e-test.sh sotaapp2:test

      # E2E が通ったイメージだけを push する
      - name: Push image
        if: steps.reuse.outputs.reused != 'true' && steps.push-check.outputs.should_push == 'true'
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          TAGS="${{ steps.vars.outputs.sha_tag }}"
          if [[ "${{ github.event_name }}" == "push" ]]; then
            TAGS="$TAGS latest"
          fi
          for t in $TAGS; do
            docker tag sotaapp2:test "${IMAGE}:${t}"
            docker push "${IMAGE}:${t}"
          done
