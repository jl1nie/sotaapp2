# fly.toml app configuration file generated for sotaapp2 on 2025-12-28T19:06:21+09:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'sotaapp2'
primary_region = 'nrt'
swap_size_mb = 256

[build]
  image = 'jl1nie/sotaapp2:latest'

[[mounts]]
  source = 'data'
  destination = '/data'
  processes = ['app']

[deploy]
  strategy = 'immediate'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  # 同時に処理するリクエスト数の上限。小さいマシン(256MB・1 台)を、過負荷から守る最後の防波堤。
  # - type = 'requests': 処理中のリクエスト数で測る(Fly のプロキシは接続を再利用するので、'connections' は負荷を反映しない)
  # - hard_limit: 上限に達すると、そのマシンへ新しいリクエストを送らなくなる。緩く(100)から始めて、
  #   メモリの使用量を見ながら下げる。soft_limit は複数台にしたときの負荷分散の目安(今は 1 台なので効かない)
  # - 通常は Cloudflare のキャッシュとレート制限(sotalive-monorepo の infra/zone.tf)で、ここまで届かない
  [http_service.concurrency]
    type = 'requests'
    soft_limit = 50
    hard_limit = 100

[checks]
  [checks.health]
    port = 8080
    type = 'http'
    interval = '30s'
    timeout = '20s'
    grace_period = '60s'
    method = 'GET'
    path = '/api/v2/health'

[[restart]]
  policy = 'on-failure'
  retries = 3
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
